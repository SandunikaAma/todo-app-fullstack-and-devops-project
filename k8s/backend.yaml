apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: sandunikaamarasekara/todo-backend:latest

          ports:
            - containerPort: 5001

          env:
            - name: PORT
              value: "5001"

            - name: DB_HOST
              value: mysql-service

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              value: root

            - name: DB_NAME
              value: todoapp

            - name: DB_PORT
              value: "3306"

---

apiVersion: v1
kind: Service

metadata:
  name: backend-service

spec:
  selector:
    app: backend

  ports:
    - port: 5001
      targetPort: 5001